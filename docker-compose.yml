services:
  db:
    image: postgres:16-alpine
    container_name: techspire_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hms_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hms_prod_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_management_system}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hms_prod_user} -d ${POSTGRES_DB:-hospital_management_system}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: techspire_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techspire_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://hms_prod_user:hms_prod_password_2026@db:5432/hospital_management_system}
      SECRET_KEY: ${SECRET_KEY:-hms_jwt_production_secret_key_2026_techspire}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techspire_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
